[package]
name = "scratch-link-rs"
version = "0.1.0"
edition = "2021"
description = "Scratch Link compatible BLE bridge (multiplatform, multi-device)"
license = "MIT OR Apache-2.0"
repository = "https://github.com/cyberbeat/scratch-link-rs"

[dependencies]
btleplug = "0.13"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
serde_json = "1"
uuid = "1"
base64 = "0.22"
sha1 = "0.10"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
anyhow = "1"
